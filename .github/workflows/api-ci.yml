name: api-ci

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: apps/api/pyproject.toml
      - run: uv sync
      # Migration consistency: proves every migration applies cleanly from
      # an empty database, in order, with no manual intervention (Phase 9
      # spec §3/§9). Deliberately NOT `alembic check` — that command's
      # autogenerate-diff comparison has a known SQLite CHECK-constraint
      # reflection false-positive, already documented in
      # docs/adr/0007-phase-7-skills-bottleneck-analysis.md and
      # docs/adr/0009-phase-9-production-readiness.md, that would fail CI
      # on every run for a reason that isn't a real migration problem.
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
