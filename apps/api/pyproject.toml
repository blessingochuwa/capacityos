[project]
name = "capacityos-api"
version = "0.1.0"
description = "CapacityOS backend — FastAPI application, domain services, and capacity engine."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.14",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults (the classic mutable-default
# footgun) — but FastAPI's Depends()/Query()/Body() are *designed* to be used
# exactly this way; FastAPI inspects the default value itself to wire up
# dependency injection, so this is the correct, intentional, framework-
# mandated pattern (see FastAPI's own docs), not a bug B008 is meant to catch.
"app/api/**" = ["B008"]
# Alembic-generated migrations are not hand-formatted; re-wrapping their long
# autogenerated `sa.Column(...)`/`sa.Enum(...)` lines, or rewriting Alembic's
# own `typing.Union`/import style, by hand would make the file diverge from
# what `alembic revision --autogenerate` actually produced each time it's
# regenerated. E501: long column/constraint definitions. I001/UP035/UP007:
# Alembic's template still uses `from typing import Sequence, Union`.
"alembic/versions/**" = ["E501", "I001", "UP035", "UP007"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["app", "tests", "alembic"]
executionEnvironments = [
    { root = "tests", reportUnknownVariableType = false, reportUnknownMemberType = false, reportUnknownArgumentType = false },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
